name: Deploy Nuxt site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: production
      NUXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare sibling resume checkout
        run: |
          mkdir -p ../static
          if [ -d ../static/resume ]; then rm -rf ../static/resume; fi
          git clone --depth 1 https://github.com/FlorianEagox/resume.git ../static/resume

      - name: Install native build dependencies for canvas/sharp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libvips42 \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          check-latest: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate thumbnails
        run: bun run thumbnails

      - name: Generate Nuxt static site
        run: bun run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./generated

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
